<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3e7d8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="koyr-version" content="2026.09.20.10">
  <title>Tónatúrar · Skráset tímar</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --blue: #9a4f32;
      --blue-dark: #783820;
      --blue-soft: #f3e2d4;
      --ink: #302923;
      --muted: #786b61;
      --line: #dfd0c2;
      --card: #fffaf4;
      --field: #fffdf9;
      --success: #2d6849;
      --error: #a13b32;
      --warning: #95601c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 88% 4%, rgba(201, 137, 95, 0.18), transparent 25rem),
        linear-gradient(180deg, #f3e7d8 0, #f8f1e8 44%, #fdfaf6 100%);
      color: var(--ink);
    }

    main {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
    }

    header { margin: 8px 2px 24px; }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      color: var(--blue-dark);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .music-clef {
      font-family: "Apple Symbols", "Noto Music", "Segoe UI Symbol", serif;
      font-size: 1.45rem;
      font-weight: 400;
      line-height: 1;
      transform: translateY(-1px);
    }

    .app-update-button {
      width: auto;
      min-height: 36px;
      margin: 0;
      padding: 0 12px;
      color: var(--blue-dark);
      background: rgba(255, 250, 244, 0.86);
      border: 1px solid rgba(120, 56, 32, 0.22);
      box-shadow: none;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .app-update-button:hover,
    .app-update-button.update-available {
      color: #fff;
      background: var(--blue);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .intro {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    form,
    .registered {
      padding: 22px;
      background: rgba(255, 250, 244, 0.97);
      border: 1px solid rgba(120, 56, 32, 0.11);
      border-radius: 22px;
      box-shadow:
        0 20px 48px rgba(83, 55, 37, 0.11),
        0 2px 8px rgba(83, 55, 37, 0.05);
    }

    .field {
      min-width: 0;
      margin-bottom: 18px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 7px;
      font-size: 0.95rem;
      font-weight: 750;
    }

    .field-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      color: var(--blue);
      stroke-width: 2.15;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 52px;
      border-radius: 12px;
      font: inherit;
    }

    input,
    select {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 0 14px;
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--line);
      font-size: 16px;
    }

    .date-control {
      position: relative;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 52px;
      overflow: hidden;
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .date-control:focus-within {
      outline: 3px solid rgba(154, 79, 50, 0.16);
      border-color: var(--blue);
    }

    .date-display {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 14px;
      font-size: 16px;
      pointer-events: none;
    }

    .date-control input[type="date"] {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      opacity: 0;
      border: 0;
      border-radius: 0;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(154, 79, 50, 0.16);
      border-color: var(--blue);
    }

    .route {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      margin-top: 4px;
      padding: 0 18px;
      color: #fff;
      background: var(--blue);
      border: 0;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 9px 22px rgba(120, 56, 32, 0.24);
    }

    button:hover { background: var(--blue-dark); }
    button:disabled { opacity: 0.62; cursor: wait; }

    #submit-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .button-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      stroke-width: 2.2;
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .status {
      display: none;
      margin: 16px 0 0;
      padding: 13px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-weight: 700;
    }

    .status.success {
      display: block;
      color: var(--success);
      background: #e8f2eb;
    }

    .status.error {
      display: block;
      color: var(--error);
      background: #f8e9e5;
    }

    .registered {
      margin-top: 18px;
      padding: 18px 20px;
    }

    .registered-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .registered h2 {
      margin: 0;
      font-size: 1.08rem;
    }

    .refresh-button {
      width: auto;
      min-height: 38px;
      margin: 0;
      padding: 0 12px;
      color: var(--blue);
      background: var(--blue-soft);
      box-shadow: none;
      font-size: 0.82rem;
    }

    .refresh-button:hover {
      color: #fff;
      background: var(--blue);
    }

    .month-label {
      margin: 5px 0 14px;
      color: var(--muted);
      font-size: 0.88rem;
      text-transform: capitalize;
    }

    .days-list {
      display: grid;
      gap: 8px;
    }

    .day-row {
      display: grid;
      gap: 7px;
      padding: 13px 14px;
      background: #fbf3e9;
      border: 1px solid #eadbcd;
      border-radius: 13px;
    }

    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .day-date {
      font-weight: 750;
      text-transform: capitalize;
    }

    .trip-details {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .trip-status {
      font-size: 0.86rem;
      font-weight: 800;
    }

    .trip-status.documented { color: var(--success); }
    .trip-status.check { color: var(--error); }
    .trip-status.no-tunnel { color: var(--muted); }

    .day-actions {
      display: flex;
      gap: 7px;
    }

    .edit-button,
    .delete-button,
    .cancel-button {
      width: auto;
      min-height: 36px;
      margin: 0;
      padding: 0 12px;
      box-shadow: none;
      font-size: 0.82rem;
    }

    .delete-button {
      color: #9f2929;
      background: #f8e7e2;
    }

    .delete-button:hover {
      color: #fff;
      background: #b83232;
    }

    .cancel-button {
      display: none;
      margin-top: 10px;
      color: var(--blue);
      background: var(--blue-soft);
    }

    .days-message {
      margin: 0;
      padding: 8px 0 2px;
      color: var(--muted);
      line-height: 1.45;
    }

    .days-message.error { color: var(--error); }

    .note {
      margin: 18px 4px 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
      text-align: center;
    }

    @media (max-width: 390px) {
      form { padding: 18px; }
      .registered { padding: 17px; }
      .route { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v4M16 2v4M3 10h18"/>
        <rect x="3" y="4" width="18" height="18" rx="2"/>
      </symbol>
      <symbol id="icon-start" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
      </symbol>
      <symbol id="icon-destination" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </symbol>
      <symbol id="icon-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 11 2-5h10l2 5M4 11h16a2 2 0 0 1 2 2v5H2v-5a2 2 0 0 1 2-2Z"/>
        <path d="M5 18v2M19 18v2M6 14h.01M18 14h.01"/>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="m8 12 2.5 2.5L16 9"/>
      </symbol>
    </defs>
  </svg>
  <main>
    <header>
      <div class="header-top">
        <p class="eyebrow">
          <span>Tónatúrar</span>
          <span class="music-clef" aria-hidden="true">𝄞</span>
        </p>
        <button id="app-update-button" class="app-update-button" type="button">Dagfør</button>
      </div>
      <h1>Skráset tímar</h1>
    </header>

    <form id="trip-form">
      <div class="field">
        <label for="date">
          <svg class="field-icon" aria-hidden="true"><use href="#icon-calendar"></use></svg>
          <span>Dato</span>
        </label>
        <div class="date-control">
          <span id="date-display" class="date-display" aria-hidden="true"></span>
          <input id="date" name="date" type="date" required aria-label="Dato">
        </div>
      </div>

      <div class="route">
        <div class="field">
          <label for="from">
            <svg class="field-icon" aria-hidden="true"><use href="#icon-start"></use></svg>
            <span>Fra</span>
          </label>
          <select id="from" name="from" required>
            <option value="">Vælg sted</option>
            <option>Hoyvík</option>
            <option>Giljanes</option>
            <option>Sørvágur</option>
          </select>
        </div>

        <div class="field">
          <label for="to">
            <svg class="field-icon" aria-hidden="true"><use href="#icon-destination"></use></svg>
            <span>Til</span>
          </label>
          <select id="to" name="to" required>
            <option value="">Vælg sted</option>
            <option>Hoyvík</option>
            <option>Giljanes</option>
            <option>Sørvágur</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="car">
          <svg class="field-icon" aria-hidden="true"><use href="#icon-car"></use></svg>
          <span>Bil</span>
        </label>
        <select id="car" name="car" required>
          <option value="">Vælg bil</option>
          <option value="BP311">Katrins bil · BP311</option>
          <option value="FA838">BMW · FA838</option>
          <option value="DV871">Toyota · DV871</option>
        </select>
      </div>

      <button id="submit-button" type="submit">
        <svg class="button-icon" aria-hidden="true"><use href="#icon-check"></use></svg>
        <span>Goym túr</span>
      </button>
      <button id="cancel-button" class="cancel-button" type="button">Annuller rettelse</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <section class="registered" aria-labelledby="registered-title">
      <div class="registered-heading">
        <h2 id="registered-title">Skrásettir túrar</h2>
        <button id="refresh-button" class="refresh-button" type="button">Dagfør</button>
      </div>
      <p id="month-label" class="month-label"></p>
      <div id="registered-days" class="days-list" aria-live="polite">
        <p class="days-message">Henter registreringer…</p>
      </div>
    </section>

    <p class="note">Michael hEsTa-HoPp</p>
  </main>

  <script>
    const form = document.querySelector("#trip-form");
    const appUpdateButton = document.querySelector("#app-update-button");
    const dateInput = document.querySelector("#date");
    const dateDisplay = document.querySelector("#date-display");
    const fromInput = document.querySelector("#from");
    const toInput = document.querySelector("#to");
    const submitButton = document.querySelector("#submit-button");
    const submitButtonLabel = submitButton.querySelector("span");
    const cancelButton = document.querySelector("#cancel-button");
    const statusBox = document.querySelector("#status");
    const refreshButton = document.querySelector("#refresh-button");
    const monthLabel = document.querySelector("#month-label");
    const registeredDays = document.querySelector("#registered-days");
    let loadedMonth = "";
    let editingTrip = null;
    let editingEnabled = false;

    const faroeDate = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Atlantic/Faroe",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());

    const monthFormatter = new Intl.DateTimeFormat("da-DK", {
      month: "long",
      year: "numeric",
      timeZone: "UTC"
    });

    const dayFormatter = new Intl.DateTimeFormat("da-DK", {
      weekday: "short",
      day: "numeric",
      month: "long",
      timeZone: "UTC"
    });

    function updateDateDisplay() {
      if (!dateInput.value) {
        dateDisplay.textContent = "Vælg dato";
        return;
      }

      const [year, month, day] = dateInput.value.split("-").map(Number);
      dateDisplay.textContent = new Intl.DateTimeFormat("da-DK", {
        day: "numeric",
        month: "short",
        year: "numeric",
        timeZone: "UTC"
      }).format(new Date(Date.UTC(year, month - 1, day, 12)));
    }

    dateInput.value = faroeDate;
    updateDateDisplay();

    function reloadApp() {
      appUpdateButton.disabled = true;
      appUpdateButton.textContent = "Dagførir…";
      window.location.replace("/?refresh=" + Date.now());
    }

    async function checkForAppUpdate() {
      try {
        const response = await fetch("/?version=" + Date.now(), { cache: "no-store" });
        const html = await response.text();
        const latest = html.match(/name="koyr-version" content="([^"]+)"/)?.[1];
        const current = document.querySelector('meta[name="koyr-version"]')?.content;

        if (latest && current && latest !== current) {
          appUpdateButton.classList.add("update-available");
          appUpdateButton.textContent = "Nýggj útgáva klár";
        }
      } catch {
        // Appen kan stadig bruges uden versionskontrol, hvis telefonen er offline.
      }
    }

    appUpdateButton.addEventListener("click", reloadApp);

    function selectedMonth() {
      return dateInput.value.slice(0, 7);
    }

    function monthDate(month) {
      const [year, monthNumber] = month.split("-").map(Number);
      return new Date(Date.UTC(year, monthNumber - 1, 1, 12));
    }

    function displayDate(date) {
      return dayFormatter.format(new Date(date + "T12:00:00Z"));
    }

    function carName(registration) {
      const names = {
        BP311: "Katrins bil",
        FA838: "BMW",
        DV871: "Toyota"
      };
      return (names[registration] || "Bil") + " · " + registration;
    }

    function statusPresentation(value) {
      if (value === "Dokumenteret") {
        return { className: "documented", text: "Tunnil góðkendur" };
      }
      if (value === "Ingen tunnel") {
        return { className: "no-tunnel", text: "Eingin tunnil millum hesar bygdir" };
      }
      return { className: "check", text: "Ingen passage fundet. Kontrollér bilen." };
    }

    function beginEdit(trip) {
      editingTrip = trip;
      dateInput.value = trip.date;
      updateDateDisplay();
      fromInput.value = trip.from;
      toInput.value = trip.to;
      document.querySelector("#car").value = trip.car;
      submitButtonLabel.textContent = "Goym broyting";
      cancelButton.style.display = "block";
      statusBox.className = "status";
      statusBox.textContent = "";
      form.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function stopEditing() {
      editingTrip = null;
      submitButtonLabel.textContent = "Goym túr";
      cancelButton.style.display = "none";
    }

    async function deleteTrip(trip, button) {
      const confirmed = window.confirm(
        "Vil du slette turen " + displayDate(trip.date) + " fra " + trip.from + " til " + trip.to + "?"
      );

      if (!confirmed) {
        return;
      }

      button.disabled = true;
      button.textContent = "Sletter…";
      statusBox.className = "status";
      statusBox.textContent = "";

      try {
        const response = await fetch("/api/register-trip", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            row: trip.row,
            date: trip.date,
            from: trip.from,
            to: trip.to,
            car: trip.car
          })
        });
        const result = await response.json();

        if (!response.ok || !result.ok || !result.deleted) {
          throw new Error(result.message || "Registreringen kunne ikke slettes.");
        }

        if (editingTrip && editingTrip.row === trip.row) {
          stopEditing();
        }

        statusBox.className = "status success";
        statusBox.textContent = "Registreringen er slettet.";
        await loadRegisteredDays(true);
      } catch (error) {
        statusBox.className = "status error";
        statusBox.textContent = error.message || "Registreringen kunne ikke slettes. Prøv igen.";
        button.disabled = false;
        button.textContent = "Strika";
      }
    }

    function renderTrips(trips) {
      registeredDays.replaceChildren();

      if (!trips.length) {
        const message = document.createElement("p");
        message.className = "days-message";
        message.textContent = "Der er endnu ingen registrerede ture i denne måned.";
        registeredDays.append(message);
        return;
      }

      for (const trip of trips) {
        const row = document.createElement("div");
        row.className = "day-row";

        const top = document.createElement("div");
        top.className = "day-top";

        const date = document.createElement("span");
        date.className = "day-date";
        date.textContent = displayDate(trip.date);

        top.append(date);

        if (editingEnabled) {
          const actions = document.createElement("div");
          actions.className = "day-actions";

          const edit = document.createElement("button");
          edit.className = "edit-button";
          edit.type = "button";
          edit.textContent = "Broyt";
          edit.addEventListener("click", () => beginEdit(trip));

          const remove = document.createElement("button");
          remove.className = "delete-button";
          remove.type = "button";
          remove.textContent = "Strika";
          remove.addEventListener("click", () => deleteTrip(trip, remove));

          actions.append(edit, remove);
          top.append(actions);
        }

        const details = document.createElement("div");
        details.className = "trip-details";
        details.textContent = trip.from + " → " + trip.to + " · " + carName(trip.car);

        const status = statusPresentation(trip.status);
        const statusLine = document.createElement("div");
        statusLine.className = "trip-status " + status.className;
        statusLine.textContent = status.text;

        row.append(top, details, statusLine);
        registeredDays.append(row);
      }
    }

    async function loadRegisteredDays(force = false) {
      const month = selectedMonth();

      if (!month || (!force && month === loadedMonth)) {
        return;
      }

      loadedMonth = month;
      monthLabel.textContent = monthFormatter.format(monthDate(month));
      registeredDays.innerHTML = '<p class="days-message">Henter registreringer…</p>';
      refreshButton.disabled = true;

      try {
        const response = await fetch("/api/register-trip?month=" + encodeURIComponent(month), {
          headers: { "Accept": "application/json" }
        });
        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.message || "Oversigten kunne ikke hentes.");
        }

        editingEnabled = result.canEdit === true;
        renderTrips(Array.isArray(result.trips) ? result.trips : []);
      } catch (error) {
        registeredDays.innerHTML = "";
        const message = document.createElement("p");
        message.className = "days-message error";
        message.textContent = error.message?.includes("expected pattern")
          ? "Registreringerne kunne ikke hentes. Tryk på Dagfør og prøv igen."
          : error.message || "Oversigten kunne ikke hentes.";
        registeredDays.append(message);
      } finally {
        refreshButton.disabled = false;
      }
    }

    dateInput.addEventListener("change", () => {
      updateDateDisplay();
      loadRegisteredDays();
    });
    refreshButton.addEventListener("click", () => loadRegisteredDays(true));
    cancelButton.addEventListener("click", stopEditing);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.className = "status";
      statusBox.textContent = "";

      const data = Object.fromEntries(new FormData(form));

      if (editingTrip) {
        Object.assign(data, {
          row: editingTrip.row,
          originalDate: editingTrip.date,
          originalFrom: editingTrip.from,
          originalTo: editingTrip.to,
          originalCar: editingTrip.car
        });
      }

      if (data.from === data.to) {
        statusBox.className = "status error";
        statusBox.textContent = "Fra og til kan ikke være det samme sted.";
        return;
      }

      submitButton.disabled = true;
      submitButtonLabel.textContent = "Goymir…";

      try {
        const response = await fetch("/api/register-trip", {
          method: editingTrip ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.message || "Turen kunne ikke gemmes.");
        }

        statusBox.className = "status success";
        statusBox.textContent = result.updated
          ? "Registreringen er rettet."
          : result.duplicate
            ? "Turen var allerede registreret."
            : "Turen er gemt i arbejdsarket.";

        if (result.updated || !result.duplicate) {
          stopEditing();
          fromInput.value = "";
          toInput.value = "";
          await loadRegisteredDays(true);
        }
      } catch (error) {
        statusBox.className = "status error";
        statusBox.textContent = error.message || "Turen kunne ikke gemmes. Prøv igen.";
      } finally {
        submitButton.disabled = false;
        submitButtonLabel.textContent = editingTrip ? "Goym broyting" : "Goym túr";
      }
    });

    loadRegisteredDays(true);
    checkForAppUpdate();
  </script>
</body>
</html>
