<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174a7e">
  <title>Koyr · Registrer arbejdsdag</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --blue: #174a7e;
      --blue-dark: #10375f;
      --blue-soft: #eaf2fa;
      --ink: #183047;
      --muted: #647587;
      --line: #d7e0e8;
      --success: #17663a;
      --error: #a42929;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #eef4fa 0, #f7f9fb 45%, #ffffff 100%);
      color: var(--ink);
    }

    main {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
    }

    header { margin: 8px 2px 24px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .intro {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    form,
    .registered {
      padding: 22px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(23, 74, 126, 0.12);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(24, 48, 71, 0.10);
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: 0.95rem;
      font-weight: 750;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 52px;
      border-radius: 12px;
      font: inherit;
    }

    input,
    select {
      padding: 0 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(23, 74, 126, 0.16);
      border-color: var(--blue);
    }

    .route {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      margin-top: 4px;
      padding: 0 18px;
      color: #fff;
      background: var(--blue);
      border: 0;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(23, 74, 126, 0.24);
    }

    button:hover { background: var(--blue-dark); }
    button:disabled { opacity: 0.62; cursor: wait; }

    .status {
      display: none;
      margin: 16px 0 0;
      padding: 13px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-weight: 700;
    }

    .status.success {
      display: block;
      color: var(--success);
      background: #e9f7ef;
    }

    .status.error {
      display: block;
      color: var(--error);
      background: #fcecec;
    }

    .registered {
      margin-top: 18px;
      padding: 18px 20px;
    }

    .registered-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .registered h2 {
      margin: 0;
      font-size: 1.08rem;
    }

    .refresh-button {
      width: auto;
      min-height: 38px;
      margin: 0;
      padding: 0 12px;
      color: var(--blue);
      background: var(--blue-soft);
      box-shadow: none;
      font-size: 0.82rem;
    }

    .refresh-button:hover {
      color: #fff;
      background: var(--blue);
    }

    .month-label {
      margin: 5px 0 14px;
      color: var(--muted);
      font-size: 0.88rem;
      text-transform: capitalize;
    }

    .days-list {
      display: grid;
      gap: 8px;
    }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 10px 12px;
      background: #f5f8fb;
      border: 1px solid #e4ebf1;
      border-radius: 11px;
    }

    .day-date {
      font-weight: 750;
      text-transform: capitalize;
    }

    .day-count {
      color: var(--success);
      font-size: 0.88rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .days-message {
      margin: 0;
      padding: 8px 0 2px;
      color: var(--muted);
      line-height: 1.45;
    }

    .days-message.error { color: var(--error); }

    .note {
      margin: 18px 4px 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
      text-align: center;
    }

    @media (max-width: 390px) {
      form { padding: 18px; }
      .registered { padding: 17px; }
      .route { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Katrins arbejdsdage</p>
      <h1>Registrer en tur</h1>
      <p class="intro">Udfyld dato, rute og bil. Turen gemmes direkte i arbejdsarket.</p>
    </header>

    <form id="trip-form">
      <div class="field">
        <label for="date">Dato</label>
        <input id="date" name="date" type="date" required>
      </div>

      <div class="route">
        <div class="field">
          <label for="from">Fra</label>
          <select id="from" name="from" required>
            <option value="">Vælg sted</option>
            <option>Hoyvík</option>
            <option>Giljanes</option>
            <option>Sørvágur</option>
          </select>
        </div>

        <div class="field">
          <label for="to">Til</label>
          <select id="to" name="to" required>
            <option value="">Vælg sted</option>
            <option>Hoyvík</option>
            <option>Giljanes</option>
            <option>Sørvágur</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="car">Bil</label>
        <select id="car" name="car" required>
          <option value="">Vælg bil</option>
          <option value="BP311">Katrins bil · BP311</option>
          <option value="FA838">BMW · FA838</option>
          <option value="DV871">Toyota · DV871</option>
        </select>
      </div>

      <button id="submit-button" type="submit">Gem tur</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <section class="registered" aria-labelledby="registered-title">
      <div class="registered-heading">
        <h2 id="registered-title">Registrerede dage</h2>
        <button id="refresh-button" class="refresh-button" type="button">Opdater</button>
      </div>
      <p id="month-label" class="month-label"></p>
      <div id="registered-days" class="days-list" aria-live="polite">
        <p class="days-message">Henter registreringer…</p>
      </div>
    </section>

    <p class="note">Du behøver ikke logge ind på Google.</p>
  </main>

  <script>
    const form = document.querySelector("#trip-form");
    const dateInput = document.querySelector("#date");
    const fromInput = document.querySelector("#from");
    const toInput = document.querySelector("#to");
    const submitButton = document.querySelector("#submit-button");
    const statusBox = document.querySelector("#status");
    const refreshButton = document.querySelector("#refresh-button");
    const monthLabel = document.querySelector("#month-label");
    const registeredDays = document.querySelector("#registered-days");
    let loadedMonth = "";

    const faroeDate = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Atlantic/Faroe",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());

    const monthFormatter = new Intl.DateTimeFormat("da-DK", {
      month: "long",
      year: "numeric",
      timeZone: "UTC"
    });

    const dayFormatter = new Intl.DateTimeFormat("da-DK", {
      weekday: "short",
      day: "numeric",
      month: "long",
      timeZone: "UTC"
    });

    dateInput.value = faroeDate;

    function selectedMonth() {
      return dateInput.value.slice(0, 7);
    }

    function monthDate(month) {
      const [year, monthNumber] = month.split("-").map(Number);
      return new Date(Date.UTC(year, monthNumber - 1, 1, 12));
    }

    function displayDate(date) {
      return dayFormatter.format(new Date(date + "T12:00:00Z"));
    }

    function renderDays(days) {
      registeredDays.replaceChildren();

      if (!days.length) {
        const message = document.createElement("p");
        message.className = "days-message";
        message.textContent = "Der er endnu ingen registrerede ture i denne måned.";
        registeredDays.append(message);
        return;
      }

      for (const day of days) {
        const row = document.createElement("div");
        row.className = "day-row";

        const date = document.createElement("span");
        date.className = "day-date";
        date.textContent = displayDate(day.date);

        const count = document.createElement("span");
        count.className = "day-count";
        count.textContent = "✓ " + day.count + (day.count === 1 ? " tur" : " ture");

        row.append(date, count);
        registeredDays.append(row);
      }
    }

    async function loadRegisteredDays(force = false) {
      const month = selectedMonth();

      if (!month || (!force && month === loadedMonth)) {
        return;
      }

      loadedMonth = month;
      monthLabel.textContent = monthFormatter.format(monthDate(month));
      registeredDays.innerHTML = '<p class="days-message">Henter registreringer…</p>';
      refreshButton.disabled = true;

      try {
        const response = await fetch("/api/register-trip?month=" + encodeURIComponent(month), {
          headers: { "Accept": "application/json" }
        });
        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.message || "Oversigten kunne ikke hentes.");
        }

        renderDays(Array.isArray(result.days) ? result.days : []);
      } catch (error) {
        registeredDays.innerHTML = "";
        const message = document.createElement("p");
        message.className = "days-message error";
        message.textContent = error.message || "Oversigten kunne ikke hentes.";
        registeredDays.append(message);
      } finally {
        refreshButton.disabled = false;
      }
    }

    dateInput.addEventListener("change", () => loadRegisteredDays());
    refreshButton.addEventListener("click", () => loadRegisteredDays(true));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.className = "status";
      statusBox.textContent = "";

      const data = Object.fromEntries(new FormData(form));

      if (data.from === data.to) {
        statusBox.className = "status error";
        statusBox.textContent = "Fra og til kan ikke være det samme sted.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Gemmer…";

      try {
        const response = await fetch("/api/register-trip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.message || "Turen kunne ikke gemmes.");
        }

        statusBox.className = "status success";
        statusBox.textContent = result.duplicate
          ? "Turen var allerede registreret."
          : "Turen er gemt i arbejdsarket.";

        if (!result.duplicate) {
          fromInput.value = "";
          toInput.value = "";
          await loadRegisteredDays(true);
        }
      } catch (error) {
        statusBox.className = "status error";
        statusBox.textContent = error.message || "Turen kunne ikke gemmes. Prøv igen.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Gem tur";
      }
    });

    loadRegisteredDays(true);
  </script>
</body>
</html>
