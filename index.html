<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174a7e">
  <title>Koyr · Registrer arbejdsdag</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --blue: #174a7e;
      --blue-dark: #10375f;
      --blue-soft: #eaf2fa;
      --ink: #183047;
      --muted: #647587;
      --line: #d7e0e8;
      --success: #17663a;
      --error: #a42929;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #eef4fa 0, #f7f9fb 45%, #ffffff 100%);
      color: var(--ink);
    }

    main {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
    }

    header { margin: 8px 2px 24px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .intro {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      padding: 22px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(23, 74, 126, 0.12);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(24, 48, 71, 0.10);
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: 0.95rem;
      font-weight: 750;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 52px;
      border-radius: 12px;
      font: inherit;
    }

    input,
    select {
      padding: 0 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(23, 74, 126, 0.16);
      border-color: var(--blue);
    }

    .route {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      margin-top: 4px;
      padding: 0 18px;
      color: #fff;
      background: var(--blue);
      border: 0;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(23, 74, 126, 0.24);
    }

    button:hover { background: var(--blue-dark); }
    button:disabled { opacity: 0.62; cursor: wait; }

    .status {
      display: none;
      margin: 16px 0 0;
      padding: 13px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-weight: 700;
    }

    .status.success {
      display: block;
      color: var(--success);
      background: #e9f7ef;
    }

    .status.error {
      display: block;
      color: var(--error);
      background: #fcecec;
    }

    .note {
      margin: 18px 4px 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
      text-align: center;
    }

    @media (max-width: 390px) {
      form { padding: 18px; }
      .route { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Katrins arbejdsdage</p>
      <h1>Registrer en tur</h1>
      <p class="intro">Udfyld dato, rute og bil. Turen gemmes direkte i arbejdsarket.</p>
    </header>

    <form id="trip-form">
      <div class="field">
        <label for="date">Dato</label>
        <input id="date" name="date" type="date" required>
      </div>

      <div class="route">
        <div class="field">
          <label for="from">Fra</label>
          <select id="from" name="from" required>
            <option value="">Vælg sted</option>
            <option>Hoyvík</option>
            <option>Giljanes</option>
            <option>Sørvágur</option>
          </select>
        </div>

        <div class="field">
          <label for="to">Til</label>
          <select id="to" name="to" required>
            <option value="">Vælg sted</option>
            <option>Hoyvík</option>
            <option>Giljanes</option>
            <option>Sørvágur</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="car">Bil</label>
        <select id="car" name="car" required>
          <option value="">Vælg bil</option>
          <option value="BP311">Katrins bil · BP311</option>
          <option value="FA838">BMW · FA838</option>
          <option value="DV871">Toyota · DV871</option>
        </select>
      </div>

      <button id="submit-button" type="submit">Gem tur</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <p class="note">Du behøver ikke logge ind på Google.</p>
  </main>

  <script>
    const form = document.querySelector("#trip-form");
    const dateInput = document.querySelector("#date");
    const fromInput = document.querySelector("#from");
    const toInput = document.querySelector("#to");
    const submitButton = document.querySelector("#submit-button");
    const statusBox = document.querySelector("#status");

    const faroeDate = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Atlantic/Faroe",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());

    dateInput.value = faroeDate;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.className = "status";
      statusBox.textContent = "";

      const data = Object.fromEntries(new FormData(form));

      if (data.from === data.to) {
        statusBox.className = "status error";
        statusBox.textContent = "Fra og til kan ikke være det samme sted.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Gemmer…";

      try {
        const response = await fetch("/api/register-trip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.message || "Turen kunne ikke gemmes.");
        }

        statusBox.className = "status success";
        statusBox.textContent = result.duplicate
          ? "Turen var allerede registreret."
          : "Turen er gemt i arbejdsarket.";

        if (!result.duplicate) {
          fromInput.value = "";
          toInput.value = "";
        }
      } catch (error) {
        statusBox.className = "status error";
        statusBox.textContent = error.message || "Turen kunne ikke gemmes. Prøv igen.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Gem tur";
      }
    });
  </script>
</body>
</html>
